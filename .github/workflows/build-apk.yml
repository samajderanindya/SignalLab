name: Inspect SignalLab Sources

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          unzip -o SignalLab-camera-v2-fixed.zip -d project

      - name: Show project structure
        run: |
          find project/signallab/app/src/main/java -type f -name '*.kt' | sort

      - name: Print CameraScannerScreen.kt
        run: |
          echo '===== CAMERA SCANNER SOURCE ====='
          cat project/signallab/app/src/main/java/com/example/ui/screens/CameraScannerScreen.kt
          echo '===== END CAMERA SCANNER SOURCE ====='

      - name: Print LiveMarketFeed.kt
        run: |
          echo '===== LIVE MARKET FEED SOURCE ====='
          cat project/signallab/app/src/main/java/com/example/data/engine/LiveMarketFeed.kt
          echo '===== END LIVE MARKET FEED SOURCE ====='
