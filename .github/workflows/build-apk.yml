name: Build SignalLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          unzip -o SignalLab-camera-v2-fixed.zip -d project

      - name: Inspect LiveMarketFeed before patch
        run: |
          echo "===== LiveMarketFeed.kt ORIGINAL ====="
          nl -ba project/signallab/app/src/main/java/com/example/data/engine/LiveMarketFeed.kt | sed -n '1,140p'
          echo "===== TradingModels.kt ====="
          nl -ba project/signallab/app/src/main/java/com/example/data/model/TradingModels.kt | sed -n '1,220p'
          echo "===== References to LiveMarketFeed ====="
          grep -RIn "LiveMarketFeed" project/signallab/app/src/main/java || true

      - name: Patch project before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project/signallab")

          p = root / "app/src/main/java/com/example/ui/screens/CameraScannerScreen.kt"
          if p.exists():
              text = p.read_text()
              text = text.replace("runCatching { cameraProvider?.unbindAll() }", "runCatching { }")
              p.write_text(text)

          xml = root / "app/src/main/res/xml/accessibility_service_config.xml"
          if xml.exists():
              text = xml.read_text()
              text = re.sub(
                  r'android:description="[^"]*"',
                  'android:description="@string/accessibility_service_description"',
                  text,
                  count=1
              )
              xml.write_text(text)

          strings = root / "app/src/main/res/values/strings.xml"
          description = "Reads visible quote text for SignalLab market analysis. It does not place trades."
          if strings.exists():
              text = strings.read_text()
              if 'name="accessibility_service_description"' not in text:
                  text = text.replace(
                      "</resources>",
                      '    <string name="accessibility_service_description">' + description + "</string>\n</resources>"
                  )
                  strings.write_text(text)
          else:
              strings.parent.mkdir(parents=True, exist_ok=True)
              strings.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <string name="accessibility_service_description">' + description + '</string>\n'
                  '</resources>\n'
              )

          # Kotlin compatibility fix:
          # buckets.entries is a Set, while takeLast() is being resolved only for List here.
          # Convert entries to a List before taking the requested tail.
          feed = root / "app/src/main/java/com/example/data/engine/LiveMarketFeed.kt"
          if feed.exists():
              text = feed.read_text()
              old = "return buckets.entries.takeLast(max(1, count)).map { (bucket, group) ->"
              new = "return buckets.entries.toList().takeLast(max(1, count)).map { entry ->\n            val bucket = entry.key\n            val group = entry.value"
              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  raise SystemExit("Expected LiveMarketFeed.kt line was not found; refusing an unsafe patch")
              feed.write_text(text)

          print("Safe patches applied, including the LiveMarketFeed entries.toList() compatibility fix.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: project/signallab
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SignalLab-debug-APK
          path: project/signallab/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
