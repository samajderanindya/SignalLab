name: Build SignalLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          unzip -o SignalLab-camera-v2-fixed.zip -d project

      - name: Fix CameraScannerScreen.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "project/signallab/app/src/main/java/com/example/ui/screens/CameraScannerScreen.kt"
          )

          text = p.read_text()

          text = text.replace(
              "runCatching { cameraProvider?.unbindAll() }",
              "runCatching { }"
          )

          p.write_text(text)

          print("CameraScannerScreen.kt fixed.")
          PY

      - name: Fix accessibility service description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xml = Path(
              "project/signallab/app/src/main/res/xml/accessibility_service_config.xml"
          )

          text = xml.read_text()

          text = re.sub(
              r'android:description="[^"]*"',
              'android:description="@string/accessibility_service_description"',
              text,
              count=1
          )

          xml.write_text(text)

          print("Accessibility service XML fixed.")
          PY

      - name: Add accessibility service description string
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings_file = Path(
              "project/signallab/app/src/main/res/values/strings.xml"
          )

          if strings_file.exists():
              text = strings_file.read_text()

              if "accessibility_service_description" not in text:
                  insert = (
                      '    <string name="accessibility_service_description">'
                      'Reads visible Olymp Trade quote text for SignalLab market analysis. '
                      'It does not place trades.'
                      '</string>\n'
                  )

                  text = text.replace("</resources>", insert + "</resources>")
                  strings_file.write_text(text)

                  print("Accessibility service description added.")
              else:
                  print("Accessibility service description already exists.")
          else:
              strings_file.parent.mkdir(parents=True, exist_ok=True)

              strings_file.write_text(
                  '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="accessibility_service_description">Reads visible Olymp Trade quote text for SignalLab market analysis. It does not place trades.</string>
          </resources>
          '''
              )

              print("strings.xml created.")
          PY

      - name: Verify fixes
        run: |
          echo "===== CAMERA FILE CHECK ====="
          grep -n "unbindAll" \
            project/signallab/app/src/main/java/com/example/ui/screens/CameraScannerScreen.kt || true

          echo ""
          echo "===== ACCESSIBILITY XML ====="
          cat project/signallab/app/src/main/res/xml/accessibility_service_config.xml

          echo ""
          echo "===== STRINGS.XML CHECK ====="
          grep -n "accessibility_service_description" \
            project/signallab/app/src/main/res/values/strings.xml || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: project/signallab
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find project/signallab/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLab-debug-APK
          path: project/signallab/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
