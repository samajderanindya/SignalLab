name: Build SignalLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o SignalLab-live-feed-v4-fixed.zip -d project

      - name: Fix accessibility service description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("project/signallab")
          config = project / "app/src/main/res/xml/accessibility_service_config.xml"
          strings = project / "app/src/main/res/values/strings.xml"

          old = 'android:description="Reads visible Olymp Trade quote text for SignalLab market analysis. It does not place trades."'
          new = 'android:description="@string/accessibility_service_description"'

          if not config.exists():
              raise SystemExit(f"Missing file: {config}")

          text = config.read_text(encoding="utf-8")

          if old in text:
              text = text.replace(old, new)
          elif '@string/accessibility_service_description' not in text:
              raise SystemExit(
                  f"Expected accessibility description not found in {config}"
              )

          config.write_text(text, encoding="utf-8")

          if strings.exists():
              st = strings.read_text(encoding="utf-8")

              if 'name="accessibility_service_description"' not in st:
                  if '</resources>' not in st:
                      raise SystemExit(f"Invalid strings file: {strings}")

                  st = st.replace(
                      '</resources>',
                      '    <string name="accessibility_service_description">Reads visible Olymp Trade quote text for SignalLab market analysis. It does not place trades.</string>\n</resources>'
                  )

                  strings.write_text(st, encoding="utf-8")
          else:
              strings.parent.mkdir(parents=True, exist_ok=True)

              strings.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  '    <string name="accessibility_service_description">Reads visible Olymp Trade quote text for SignalLab market analysis. It does not place trades.</string>\n'
                  '</resources>\n',
                  encoding="utf-8"
              )
          PY

      - name: Fix LiveMarketFeed Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "project/signallab/app/src/main/java/com/example/data/engine/LiveMarketFeed.kt"
          )

          if not path.exists():
              raise SystemExit(f"Missing file: {path}")

          text = path.read_text(encoding="utf-8")

          old = 'return buckets.entries.takeLast(max(1, count)).map { (bucket, group) ->'

          new = '''val requestedCount = count.coerceAtLeast(1)
          val selectedEntries = buckets.entries.toList().takeLast(requestedCount)

          return selectedEntries.map { entry ->
              val bucket = entry.key
              val group = entry.value'''

          if old not in text:
              raise SystemExit(
                  "Expected LiveMarketFeed map expression was not found"
              )

          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore project/signallab/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: project/signallab
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLab-debug-apk
          path: project/signallab/**/build/outputs/apk/debug/*.apk
