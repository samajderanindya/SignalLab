name: Build SignalLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          unzip -o SignalLab-camera-v2-fixed.zip -d project

      - name: Patch project before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("project/signallab")

          # Camera source: remove reference to an unavailable cameraProvider.
          p = root / "app/src/main/java/com/example/ui/screens/CameraScannerScreen.kt"
          text = p.read_text()
          text = text.replace("runCatching { cameraProvider?.unbindAll() }", "runCatching { }")
          p.write_text(text)

          # Accessibility description must reference a string resource.
          xml = root / "app/src/main/res/xml/accessibility_service_config.xml"
          text = xml.read_text()
          text = re.sub(r'android:description="[^"]*"', 'android:description="@string/accessibility_service_description"', text, count=1)
          xml.write_text(text)

          strings = root / "app/src/main/res/values/strings.xml"
          if strings.exists():
              text = strings.read_text()
              if "accessibility_service_description" not in text:
                  text = text.replace("</resources>", '    <string name="accessibility_service_description">Reads visible quote text for SignalLab market analysis. It does not place trades.</string>\n</resources>")
                  strings.write_text(text)
          else:
              strings.parent.mkdir(parents=True, exist_ok=True)
              strings.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="accessibility_service_description">Reads visible quote text for SignalLab market analysis. It does not place trades.</string>\n</resources>\n''')

          # LiveMarketFeed: make the grouped Map.Entry types explicit and lambda item references explicit.
          p = root / "app/src/main/java/com/example/data/engine/LiveMarketFeed.kt"
          text = p.read_text()
          text, n = re.subn(r'\.map\s*\{\s*\(bucket,\s*group\)\s*->', '.map { entry ->\n                val bucket: Long = entry.key\n                val group: List<LiveTick> = entry.value', text, count=1)
          if n:
              text = re.sub(r'group\.maxOf\s*\{\s*it\.price\s*\}', 'group.maxOf { tick -> tick.price }', text)
              text = re.sub(r'group\.minOf\s*\{\s*it\.price\s*\}', 'group.minOf { tick -> tick.price }', text)
          p.write_text(text)
          print("Project patches applied.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        working-directory: project/signallab
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLab-debug-APK
          path: project/signallab/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
