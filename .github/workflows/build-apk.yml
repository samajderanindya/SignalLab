name: Build SignalLab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          unzip -o SignalLab-camera-v2-fixed.zip -d project

      - name: Fix accessibility service description
        run: |
          find project/signallab/app/src/main/res -name "accessibility_service_config.xml" -type f -exec sed -i 's/ android:description="[^"]*"//g' {} \;

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore project/signallab/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: project/signallab
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalLab-camera-v2-build
          path: project/signallab/**/build/outputs/apk/debug/*.apk
